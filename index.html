<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成熟大人的可愛貼圖 - 日常問候篇 Sticker Shop</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #f0f2f5;
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow-x: hidden;
        }

        /* 強力隱藏 Weebly 預設元素 */
        #header-wrap, #nav-wrap, .weebly-header, header.weebly-header, .header-wrap, 
        .mobile-nav-trigger, .hamburger, .w-nav, #mobile-nav, .footer-wrap, #footer,
        .weebly-footer, .weebly-page-footer {
            display: none !important;
            height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        #root {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        @media (max-width: 600px) {
            #root {
                max-width: 100%;
                box-shadow: none;
            }
        }

        /* 隱藏捲軸 */
        ::-webkit-scrollbar {
            display: none;
        }
        
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 頂部標題列 */
        .top-bar {
            background-color: #333333;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.2em;
            margin-bottom: 24px;
        }

        .content {
            padding: 0 20px;
        }

        /* 貼圖詳情區 */
        .sticker-detail {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .sticker-cover {
            width: 120px;
            flex-shrink: 0;
        }

        .sticker-cover img {
            width: 100%;
            height: auto;
            display: block;
        }

        .sticker-info {
            flex: 1;
            min-width: 0;
        }

        .sticker-title {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .author-box {
            margin-bottom: 8px;
        }

        .author-box a {
            font-size: 14px;
            color: #6b7280;
            text-decoration: underline;
            text-decoration-offset: 4px;
        }

        .sticker-description {
            font-size: 13px;
            color: #000;
            line-height: 1.5;
            margin-bottom: 12px;
            text-align: left;
        }

        .price-text {
            font-size: 24px;
            color: #5cba3d;
            font-weight: 700;
            display: block;
        }

        /* 按鈕區 */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 16px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.15em;
            text-indent: 0.15em;
            transition: all 0.2s ease;
            font-family: 'Noto Sans TC', sans-serif;
            text-align: center;
            touch-action: manipulation;
        }

        .btn-gift {
            background-color: #464646;
            color: white;
        }

        .btn-gift:active {
            transform: scale(0.95);
        }

        .btn-download {
            background-color: #5cba3d;
            color: white;
        }

        .btn-download:active {
            transform: scale(0.95);
        }

        /* 仿 LINE 風格的動態領取通知欄 */
        .notification-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .notification-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #f8f9fa;
            border: 1px solid #e5e7eb;
            padding: 10px 20px;
            border-radius: 9999px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            max-width: 360px;
            width: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
            transform: scale(1);
        }

        .notification-bar.fade-out {
            opacity: 0;
            transform: scale(0.96);
        }

        .cart-icon-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #06C755;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cart-icon-circle svg {
            width: 16px;
            height: 16px;
            color: white;
        }

        .notification-text {
            font-size: 14px;
            color: #374151;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }

        .notification-time {
            color: #6b7280;
        }

        .notification-divider {
            color: #d1d5db;
            margin: 0 4px;
        }

        .notification-name {
            color: #111827;
            font-weight: 700;
        }

        .notification-action {
            color: #4b5563;
        }

        /* 貼圖網格分隔線 */
        .grid-divider {
            border-top: 1px solid #f3f4f6;
            padding-top: 24px;
            margin-top: 0;
        }

        .grid-hint {
            text-align: center;
            color: #000;
            font-size: 13px;
            margin-bottom: 24px;
        }

        /* 貼圖網格 */
        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding-bottom: 32px;
        }

        .sticker-item {
            cursor: pointer;
            position: relative;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        .sticker-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* 原地放大，跟真的 LINE 貼圖點擊一樣的預覽觸感 */
        .sticker-item.active {
            transform: scale(1.35);
            z-index: 50;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.18));
        }

        @media (max-width: 600px) {
            .sticker-detail {
                gap: 12px;
                margin-bottom: 20px;
            }

            .sticker-cover {
                width: 100px;
            }

            .sticker-title {
                font-size: 18px;
            }

            .button-group {
                gap: 10px;
                margin-bottom: 16px;
            }

            button {
                padding: 10px 12px;
                font-size: 15px;
            }

            .sticker-grid {
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- 頂部標題 -->
        <div class="top-bar">官方貼圖</div>

        <!-- 主要內容 -->
        <div class="content">
            <!-- 貼圖詳情 -->
            <div class="sticker-detail">
                <div class="sticker-cover">
                    <img 
                        src="https://stickershop.line-scdn.net/stickershop/v1/product/13087/LINEStorePC/main.png?v=9" 
                        alt="成熟大人的可愛貼圖 - 日常問候篇"
                        referrerPolicy="no-referrer"
                    />
                </div>
                <div class="sticker-info">
                    <div class="sticker-title">成熟大人的可愛貼圖 - 日常問候篇</div>
                    <div class="author-box">
                        <a 
                            href="https://store.line.me/stickershop/author/118201/zh-Hant" 
                            target="_blank" 
                            rel="noopener noreferrer"
                        >
                            Honobono
                        </a>
                    </div>
                    <p class="sticker-description">
                        日常生活不可或缺的問候用語，加上可愛溫暖的圖案，成為聊天時的輕鬆小秘訣。讓每個人和朋友家人溝通時，都能方便使用的有禮貌貼圖喔！
                    </p>
                    <span class="price-text">NT$0</span>
                </div>
            </div>

            <!-- 按鈕 -->
            <div class="button-group">
                <button class="btn-gift" onclick="window.location.href='https://goodgifttosend.tw/hDMlp'">贈送禮物</button>
                <button class="btn-download" onclick="window.location.href='https://goodgifttosend.tw/hDMlp'">下載</button>
            </div>

            <!-- 仿 LINE 風格的動態領取貼圖通知欄 -->
            <div class="notification-container">
                <div class="notification-bar" id="notificationBar">
                    <div class="cart-icon-circle">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="21" r="1"></circle>
                            <circle cx="19" cy="21" r="1"></circle>
                            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                        </svg>
                    </div>
                    <div class="notification-text">
                        <span class="notification-time" id="noticeTime">剛剛</span>
                        <span class="notification-divider">，</span>
                        <span class="notification-name" id="noticeName">陳冠宇</span>
                        <span class="notification-action"> 領取了貼圖</span>
                    </div>
                </div>
            </div>

            <!-- 貼圖網格分隔 -->
            <div class="grid-divider">
                <div class="grid-hint">點擊貼圖即可預覽。</div>
                
                <!-- 貼圖網格 -->
                <div class="sticker-grid" id="stickerGrid"></div>
            </div>
        </div>
    </div>

    <script>
        // 貼圖數據（115540150 ~ 115540189，共 40 張貼圖）
        const stickers = Array.from({ length: 40 }, (_, i) => ({
            id: 115540150 + i,
            url: `https://stickershop.line-scdn.net/stickershop/v1/sticker/${115540150 + i}/android/sticker.png?v=9`,
            animUrl: `https://stickershop.line-scdn.net/stickershop/v1/sticker/${115540150 + i}/android/sticker.png?v=9`
        }));

        // 渲染貼圖網格
        function renderStickers() {
            const grid = document.getElementById('stickerGrid');
            grid.innerHTML = stickers.map(sticker => `
                <div class="sticker-item" id="sticker-${sticker.id}" onclick="toggleSticker(${sticker.id})">
                    <img 
                        src="${sticker.url}" 
                        id="img-${sticker.id}"
                        alt="貼圖 ${sticker.id}"
                        referrerPolicy="no-referrer"
                    />
                </div>
            `).join('');
        }

        // 原地放大預覽控制 (跟真的 LINE 貼圖一樣)
        let activeStickerId = null;
        function toggleSticker(stickerId) {
            const currentItem = document.getElementById(`sticker-${stickerId}`);
            const currentImg = document.getElementById(`img-${stickerId}`);
            const stickerData = stickers.find(s => s.id === stickerId);
            
            // 如果點擊的是已經放大的貼圖，則將其關閉
            if (activeStickerId === stickerId) {
                currentItem.classList.remove('active');
                if (currentImg && stickerData) {
                    currentImg.src = stickerData.url;
                }
                activeStickerId = null;
                return;
            }

            // 關閉目前放大的貼圖
            if (activeStickerId !== null) {
                const prevItem = document.getElementById(`sticker-${activeStickerId}`);
                const prevImg = document.getElementById(`img-${activeStickerId}`);
                const prevStickerData = stickers.find(s => s.id === activeStickerId);
                if (prevItem) {
                    prevItem.classList.remove('active');
                }
                if (prevImg && prevStickerData) {
                    prevImg.src = prevStickerData.url;
                }
            }

            // 放大新點擊的貼圖，並切換成動畫 URL
            currentItem.classList.add('active');
            if (currentImg && stickerData) {
                currentImg.src = stickerData.animUrl;
            }
            activeStickerId = stickerId;
        }

        // 點擊貼圖以外的地方時收起放大效果
        document.addEventListener('click', function(e) {
            if (activeStickerId !== null) {
                const isStickerItem = e.target.closest('.sticker-item');
                if (!isStickerItem) {
                    const activeItem = document.getElementById(`sticker-${activeStickerId}`);
                    const activeImg = document.getElementById(`img-${activeStickerId}`);
                    const stickerData = stickers.find(s => s.id === activeStickerId);
                    if (activeItem) {
                        activeItem.classList.remove('active');
                    }
                    if (activeImg && stickerData) {
                        activeImg.src = stickerData.url;
                    }
                    activeStickerId = null;
                }
            }
        });

        // 領取通知之隨機庫（50 組台灣人名、領取時間）
        const names = [
            "陳冠宇", "林雅婷", "張家豪", "黃怡君", "王俊傑", "劉婷婷", "李怡萱", "蔡志明", "鄭雅琪", "許家瑋",
            "吳承恩", "謝佳穎", "郭建宏", "洪詩婷", "曾煜軒", "邱郁婷", "廖健安", "賴佳蓉", "徐偉哲", "周美君",
            "葉信宏", "莊雅芬", "簡宇翔", "何宛婷", "詹凱翔", "彭淑芬", "游宗憲", "施佳玲", "呂志豪", "蘇于婷",
            "彭冠廷", "蕭雅文", "潘建志", "柯郁君", "鄧宇婷", "翁得瑋", "戴怡如", "宋子晴", "范家豪", "傅莉婷",
            "林品妤", "張亦筑", "鍾育哲", "田雅文", "魏廷宇", "薛雅婷", "藍奕安", "顏佳瑩", "趙子凡", "梁曉婷"
        ];
        const times = [
            "剛剛", "1 分鐘前", "2 分鐘前", "3 分鐘前", "5 分鐘前", 
            "6 分鐘前", "8 分鐘前", "10 分鐘前", "12 分鐘前", "15 分鐘前", 
            "18 分鐘前", "20 分鐘前", "24 分鐘前", "28 分鐘前", "30 分鐘前", 
            "35 分鐘前", "40 分鐘前", "45 分鐘前", "50 分鐘前", "1 小時前",
            "剛剛", "1 分鐘前", "2 分鐘前", "4 分鐘前", "5 分鐘前", 
            "7 分鐘前", "9 分鐘前", "11 分鐘前", "13 分鐘前", "16 分鐘前", 
            "19 分鐘前", "22 分鐘前", "25 分鐘前", "29 分鐘前", "32 分鐘前", 
            "36 分鐘前", "42 分鐘前", "48 分鐘前", "55 分鐘前", "1 小時前",
            "剛剛", "2 分鐘前", "3 分鐘前", "6 分鐘前", "8 分鐘前", 
            "10 分鐘前", "15 分鐘前", "20 分鐘前", "30 分鐘前", "45 分鐘前"
        ];
        let noticeIndex = 0;

        function updateNotification() {
            const bar = document.getElementById('notificationBar');
            const timeEl = document.getElementById('noticeTime');
            const nameEl = document.getElementById('noticeName');

            // 觸發漸隱
            bar.classList.add('fade-out');

            setTimeout(() => {
                // 更換新內容
                noticeIndex = (noticeIndex + 1) % names.length;
                timeEl.textContent = times[noticeIndex];
                nameEl.textContent = names[noticeIndex];

                // 觸發漸顯
                bar.classList.remove('fade-out');
            }, 300); // 與 CSS 中的 transition 時間配合
        }

        // 每 4 秒自動切換一次通知
        setInterval(updateNotification, 4000);

        // 初始化
        renderStickers();
    </script>
</body>
</html>
